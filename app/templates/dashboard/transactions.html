<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<!-- Init theme from localStorage before render to prevent flash -->
<script>if(localStorage.getItem('arthalens-theme')==='light')document.documentElement.classList.add('light-mode');</script>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta name="color-scheme" content="dark">
<!-- CSRF token for POST requests -->
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>ArthaLens — Transactions</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.output.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── CSS Variables — ported verbatim from newDashboard.html (single design system) ── */
  :root {
    /* Dark mode = right strip of colourPallet.jpeg: vertical wash, Tetsu-Kon Blue → Light Violet */
    --bg: linear-gradient(180deg, #17184B 0%, #273287 45%, #6B5FA8 75%, #D6B4FC 100%);
    --card: rgba(23, 24, 75, 0.55);            /* Tetsu-Kon Blue, translucent glass */
    --navbar: rgba(23, 24, 75, 0.66);          /* Tetsu-Kon Blue, slightly more opaque */
    --border: rgba(39, 50, 135, 0.45);         /* Intergalactic Highway, low opacity */
    --text-primary: #F0EEE9;                   /* Cloud Dancer — 16:1 on navy */
    --text-secondary: rgba(211, 221, 231, 0.62); /* Nordic Breeze, dimmed */
    --accent: #D6B4FC;                          /* Light Violet — fills/backgrounds */
    --accent-text: #D6B4FC;                     /* accent used as TEXT (dark = Light Violet, unchanged) */
    --on-accent: #17184B;                       /* Tetsu-Kon Blue — dark text on accent */
    --accent-soft: rgba(214, 180, 252, 0.14);   /* accent tint fill */
    --accent-border: rgba(214, 180, 252, 0.32); /* accent tint border */
    --row-hover: rgba(214, 180, 252, 0.10);     /* subtle violet tint */
  }
  html.light-mode {
    /* Light mode = left strip: vertical wash, Cloud Dancer → Nordic Breeze → Light Violet */
    --bg: linear-gradient(180deg, #F0EEE9 0%, #F0EEE9 25%, #D3DDE7 60%, #D6B4FC 100%);
    --card: rgba(240, 238, 233, 0.45);          /* Cloud Dancer, translucent glass — 0.45 for stronger frosting/gradient bleed-through in light mode (matches dark-mode's stronger glass) */
    --navbar: rgba(240, 238, 233, 0.72);
    --border: rgba(211, 221, 231, 0.90);        /* Nordic Breeze, low opacity */
    --text-primary: #17184B;                    /* Tetsu-Kon Blue — 16:1 on Cloud Dancer */
    --text-secondary: rgba(39, 50, 135, 0.80);  /* Intergalactic Highway, dimmed — darkened 0.72→0.80 to keep AA contrast on the more-translucent (0.45) cards over the violet gradient */
    --accent: #D8E63C;                           /* Duranta Yellow — fills/backgrounds (unchanged) */
    --accent-text: #17184B;                      /* accent TEXT → Tetsu-Kon Blue in light mode (yellow text reads poorly on Cloud Dancer); fills stay yellow */
    --on-accent: #17184B;                        /* Tetsu-Kon Blue — dark text on accent */
    --accent-soft: rgba(216, 230, 60, 0.18);
    --accent-border: rgba(216, 230, 60, 0.38);
    --row-hover: rgba(216, 230, 60, 0.14);       /* subtle yellow tint */
  }
  /* Light-mode overrides (only what CSS variables can't express — matches dashboard) */
  html.light-mode .text-white { color: var(--text-primary) !important; }
  html.light-mode .shimmer { background: linear-gradient(90deg, #F0EEE9 0%, #D3DDE7 50%, #F0EEE9 100%); background-size: 200% 100%; }
  /* Transaction row hover — theme-aware */
  .transaction-row:hover { background-color: var(--row-hover) !important; }
  /* Table row dividers via border */
  #txn-tbody tr { border-bottom: 1px solid var(--border); }
  /* Theme toggle pill */
  .theme-toggle-pill {
    width: 48px; height: 24px;
    border-radius: 12px;
    background: var(--border);
    border: none;
    cursor: pointer;
    position: relative;
    transition: background 0.25s;
    flex-shrink: 0;
  }
  .theme-toggle-pill-circle {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    position: absolute;
    top: 2px; left: 2px;
    transition: transform 0.25s;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    pointer-events: none;
  }
  html.light-mode .theme-toggle-pill-circle { transform: translateX(24px); }

  /* ── Mobile navigation (hamburger + dropdown panel) ────────────────────────
     The desktop link row is `hidden md:flex`, so below 768px it disappears and
     the Dashboard/Transactions links become unreachable. These rules add them
     back as a dropdown under the navbar.

     Breakpoint is a real media query, NOT Tailwind `md:` variants: the
     stylesheet is a pre-compiled static bundle, so a class like `md:hidden`
     that isn't already in the bundle would silently do nothing until a
     recompile — and a missed recompile would leak the hamburger onto desktop.
     767.98px is the exact complement of Tailwind's `md` (min-width:768px), so
     the two never overlap or gap.

     This block is duplicated verbatim in newDashboard.html, transactions.html
     and upload.html — keep the three in sync. */
  .nav-mobile-toggle {
    display: none;                  /* ≥768px: the desktop link row handles nav */
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.2s, color 0.2s;
  }
  .nav-mobile-toggle:hover {
    border-color: var(--accent);
    color: var(--accent-text);
  }
  /* Mobile nav dropdown. MUST be fully opaque: it overlays live page content
     (page heading, KPI cards), so any alpha leaves that text readable through it.
     Deliberately NOT glass-morphism — unlike .card and the navbar itself, this
     panel carries no backdrop-filter, no opacity and no blend mode. --navbar is
     unusable here: it resolves to rgba(23,24,75,0.66) dark / rgba(240,238,233,
     0.72) light, so the solid Chintz surfaces are hard-coded instead. */
  .nav-mobile-panel {
    display: none;
    position: absolute;             /* <nav> is position:fixed → containing block */
    top: 100%;
    left: 0;
    right: 0;
    z-index: 60;                    /* clears the navbar's own children (auto/0)
                                       and all page content (tops out at 20) */
    flex-direction: column;
    gap: 2px;
    padding: 8px 24px 12px;         /* 24px matches the navbar's px-6 */
    background: #17184B;            /* solid Tetsu-Kon Blue — same value as --panel-bg (dark) */
    opacity: 1;
    background-blend-mode: normal;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);  /* reads as a layer above the page */
  }
  html.light-mode .nav-mobile-panel {
    background: #F0EEE9;            /* solid Cloud Dancer — same value as --panel-bg (light) */
    box-shadow: 0 12px 28px rgba(23, 24, 75, 0.22);
  }
  .nav-mobile-panel.open { display: flex; }
  .nav-mobile-link {
    display: block;
    padding: 10px 4px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-mobile-link:hover { color: var(--text-primary); }
  .nav-mobile-link.active {
    color: var(--text-primary);
    border-left: 2px solid var(--accent);
    padding-left: 10px;
  }
  @media (max-width: 767.98px) {
    .nav-mobile-toggle { display: inline-flex; }
  }
  /* Never let an open panel survive a resize/rotate onto desktop. */
  @media (min-width: 768px) {
    .nav-mobile-panel.open { display: none; }
  }

  body {
    background: var(--bg);
    background-attachment: fixed;   /* full-page gradient stays put on scroll */
    background-size: cover;         /* fill the viewport, no tiling/repeat */
    min-height: 100vh;              /* gradient spans full page height */
    color: var(--text-primary);
  }
  .card {
    background-color: var(--card);
    backdrop-filter: blur(12px);    /* let the page gradient glow through the glass surface */
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    transition: border-color 0.2s, background-color 0.25s;
  }
  .card:hover { border-color: var(--accent); }
  .glass-card {
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
  }
  .text-accent { color: var(--accent-text); }   /* accent-as-text: blue in light mode, Light Violet in dark */
  .bg-accent { background-color: var(--accent); color: var(--on-accent); }
  .bg-accent:hover { filter: brightness(0.92); }
  .border-accent { border-color: var(--accent); }
  .text-secondary { color: var(--text-secondary); }
  .shimmer {
    background: linear-gradient(90deg, #17184B 0%, #273287 50%, #17184B 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite linear;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .inline-edit-select {
    background: var(--border);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 11px;
    border-radius: 4px;
    padding: 2px 6px;
  }
  /* Subscription marker. Replaces the old red .sub-badge text pill (#dc2626 was
     ad-hoc, not a Chintz palette colour). Inline SVG via <use>, so it inherits
     colour through currentColor. Sized to the 14px text line and baseline-nudged
     so adding it does not change row height. --text-secondary is the same token
     the date cell in this row already uses, so legibility is proven in both
     themes and it reads as passive metadata, not an interactive accent. */
  .sub-icon {
    width: 14px;
    height: 14px;
    display: inline-block;
    vertical-align: -2px;
    margin-left: 6px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
</style>
</head>
<body class="font-body-md min-h-screen overflow-x-hidden">

<!-- Top Navigation — ported verbatim from newDashboard.html (glass + logo swap + toggle + profile) -->
<nav class="fixed top-0 w-full h-[56px] z-50 flex items-center justify-between px-6" style="background:var(--navbar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);transition:background-color 0.25s,border-color 0.25s">
  <div class="flex items-center">
    <!-- Themed logo (Line Logo lockup): dark variant in dark mode, light variant in
         light mode. Swap is driven by _syncThemeUI() (same place toggleTheme()
         flips html.light-mode); the inline script below sets the correct variant
         synchronously on first paint to avoid a dark→light flash. -->
    <img id="navbar-logo"
         src="{{ url_for('static', filename='images/line-logo-dark.svg') }}"
         data-logo-dark="{{ url_for('static', filename='images/line-logo-dark.svg') }}"
         data-logo-light="{{ url_for('static', filename='images/line-logo-light.svg') }}"
         alt="ArthaLens"
         style="height:28px;width:auto;max-width:100%;object-fit:contain;display:block;flex-shrink:0">
    <script>(function(){var l=document.getElementById('navbar-logo');if(l&&document.documentElement.classList.contains('light-mode'))l.src=l.dataset.logoLight;})();</script>
  </div>
  <div class="hidden md:flex items-center h-full">
    <!-- Dashboard link: NOT active on this page -->
    <a class="h-full px-4 flex items-center text-sm font-medium transition-colors"
       style="color:var(--text-secondary)"
       onmouseenter="this.style.color='var(--text-primary)'"
       onmouseleave="this.style.color='var(--text-secondary)'"
       href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <!-- Transactions link: active on this page -->
    <a class="h-full px-4 flex items-center border-b-2 border-accent text-white font-medium" href="{{ url_for('main.transactions') }}">Transactions</a>
  </div>
  <div class="flex items-center gap-4">
    <!-- Mobile nav trigger — visible only below 768px (see .nav-mobile-toggle) -->
    <button class="nav-mobile-toggle" id="nav-mobile-btn" type="button"
            onclick="toggleMobileNav()"
            aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-mobile-panel">
      <span class="material-symbols-outlined" id="nav-mobile-icon" style="font-size:20px">menu</span>
    </button>
    <!-- Theme toggle -->
    <button class="theme-toggle-pill" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle theme">
      <div class="theme-toggle-pill-circle" id="theme-circle">
        <span id="theme-icon">☾</span>
      </div>
    </button>
    <!-- Profile dropdown avatar -->
    <div style="position:relative" id="avatar-wrapper">
      <button id="avatar-btn"
        class="w-8 h-8 rounded-full flex items-center justify-center text-secondary text-xs font-bold cursor-pointer transition-colors"
        style="background:var(--border);border:1px solid var(--border)"
        onmouseenter="this.style.borderColor='var(--accent)'" onmouseleave="this.style.borderColor='var(--border)'"
        onclick="toggleProfileDropdown(event)"
        aria-label="User profile menu">
        <span class="material-symbols-outlined text-[20px]">person</span>
      </button>
      <div id="profile-dropdown"
        style="display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--border);border-radius:8px;min-width:180px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:200">
        <div style="font-weight:600;color:var(--text-primary);font-size:13px;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          {{ current_user.email }}
        </div>
        <div style="height:1px;background:var(--border);margin-bottom:10px"></div>
        <form method="POST" action="{{ url_for('auth.logout') }}" style="margin:0;padding:0">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit"
            style="width:100%;text-align:left;background:none;border:none;color:var(--text-primary);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 0;font-family:inherit"
            onmouseenter="this.style.color='var(--accent)'"
            onmouseleave="this.style.color='var(--text-primary)'">
            <span class="material-symbols-outlined" style="font-size:16px">logout</span>
            Logout
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Mobile nav panel — mirrors the `hidden md:flex` desktop link row above.
       Rendered at all widths but only displayed below 768px (.nav-mobile-panel). -->
  <div class="nav-mobile-panel" id="nav-mobile-panel">
    <a class="nav-mobile-link" href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a class="nav-mobile-link active" href="{{ url_for('main.transactions') }}">Transactions</a>
  </div>
</nav>

<!-- Main content — same containment approach as the dashboard's <main>:
     inline padding-top:64px (56px navbar + 8px), max-width:1400px !important centred,
     gradient background stays full-bleed on <body> behind this. -->
<main class="pb-8 px-6 flex flex-col gap-4" style="padding-top:64px;max-width:1400px !important;margin-left:auto !important;margin-right:auto !important;width:100%">

    <!-- Page header — matches dashboard "Spending Dashboard" header styling.
         Upload Statement button moved here (was in the navbar) to sit parallel
         with the title, exactly like the dashboard header. -->
    <header class="flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <h1 class="font-headline-lg font-bold text-white mb-1">Transactions</h1>
        <p class="font-body-md" style="color:var(--text-secondary)" id="page-subtitle">All your transactions</p>
      </div>
      <!-- Upload button — same pill/rounded shape + accent colour as the dashboard version -->
      <a href="{{ url_for('main.upload') }}" class="bg-accent font-medium px-4 py-2 rounded-full transition-colors flex items-center gap-2 no-underline">
        <span class="material-symbols-outlined text-[18px]">upload</span> Upload Statement
      </a>
    </header>

    <!-- Active filter banner (hidden by default, shown when URL params are present).
         Re-themed from the old green to the shared accent tokens. -->
    <div id="active-filter-banner" class="flex items-center gap-3 px-4 py-3 rounded-lg" style="display:none;background:var(--accent-soft);border:1px solid var(--accent-border)">
      <span class="material-symbols-outlined" style="font-size:18px;color:var(--accent-text)">filter_alt</span>
      <span id="active-filter-label" class="text-sm font-medium" style="color:var(--accent-text)"></span>
      <button onclick="clearAllFilters()" class="ml-auto text-sm px-3 py-1 rounded-lg transition-colors" style="color:var(--accent-text);border:1px solid var(--accent-border);background:none;cursor:pointer">
        Clear filter
      </button>
    </div>

    <!-- Filter / search bar — wrapped in a glass-card container (item 1) -->
    <div class="glass-card flex flex-col sm:flex-row sm:items-center justify-between gap-4" style="padding:12px 16px;border-radius:8px">
      <div id="txn-count-label" class="text-sm" style="color:var(--text-secondary)">Loading...</div>
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Search -->
        <div class="relative">
          <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none" style="font-size:16px;color:var(--text-secondary)">search</span>
          <input id="txn-search" type="text" placeholder="Search transactions…"
            class="rounded-lg text-sm pl-8 pr-3 py-2 focus:outline-none w-48"
            style="background:var(--card);border:1px solid var(--border);color:var(--text-primary);caret-color:var(--accent-text)"
            oninput="filterTransactions()"
            onfocus="this.style.borderColor='var(--accent)'"
            onblur="this.style.borderColor='var(--border)'">
        </div>
        <!-- Category filter -->
        <div class="relative">
          <select id="cat-filter" class="appearance-none rounded-lg text-sm pl-3 pr-8 py-2 focus:ring-0"
            style="background:var(--card);border:1px solid var(--border);color:var(--text-secondary)"
            onchange="filterTransactions()">
            <option value="">All Categories</option>
            <option>Food &amp; Dining</option>
            <option>Shopping</option>
            <option>Transport</option>
            <option>Utilities</option>
            <option>Entertainment</option>
            <option>Healthcare</option>
            <option>Transfer / P2P</option>
            <option>Rent</option>
            <option>Education</option>
            <option>ATM / Cash</option>
            <option>Other</option>
          </select>
          <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-[18px]" style="color:var(--text-secondary)">expand_more</span>
        </div>
        <!-- Sort -->
        <div class="relative">
          <select id="sort-select" class="appearance-none rounded-lg text-sm pl-3 pr-8 py-2 focus:ring-0"
            style="background:var(--card);border:1px solid var(--border);color:var(--text-secondary)"
            onchange="filterTransactions()">
            <option value="date_desc">Date: Newest first</option>
            <option value="date_asc">Date: Oldest first</option>
            <option value="amount_desc">Amount: High to Low</option>
            <option value="amount_asc">Amount: Low to High</option>
          </select>
          <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-[18px]" style="color:var(--text-secondary)">expand_more</span>
        </div>
      </div>
    </div>

    <!-- Transactions table card (glass via .card) -->
    <div class="card overflow-hidden flex flex-col" style="padding:0">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr style="background:var(--navbar);border-bottom:1px solid var(--border)">
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest w-[100px]" style="color:var(--text-secondary)">Date</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest" style="color:var(--text-secondary)">Merchant</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest w-[150px]" style="color:var(--text-secondary)">Category</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-right w-[120px]" style="color:var(--text-secondary)">Amount</th>
              <th class="px-6 py-4 w-[40px]"></th>
            </tr>
          </thead>
          <tbody id="txn-tbody" style="border-color:var(--border)">
            <tr><td colspan="5" class="px-6 py-2"><div class="shimmer h-8 rounded mb-1"></div></td></tr>
            <tr><td colspan="5" class="px-6 py-2"><div class="shimmer h-8 rounded mb-1"></div></td></tr>
            <tr><td colspan="5" class="px-6 py-2"><div class="shimmer h-8 rounded mb-1"></div></td></tr>
            <tr><td colspan="5" class="px-6 py-2"><div class="shimmer h-8 rounded"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="px-6 py-4 flex justify-center" style="border-top:1px solid var(--border)">
        <button id="load-more-btn" onclick="loadMoreTransactions()"
          class="px-6 py-2 rounded-lg text-sm font-medium transition-colors"
          style="background:var(--border);color:var(--text-primary);display:none">
          Load More
        </button>
      </div>
    </div>

</main>

<script>
// ============================================================
// Transactions page — self-contained
// ============================================================

const CATEGORIES = [
  'Food & Dining','Shopping','Transport','Utilities','Entertainment',
  'Healthcare','Transfer / P2P','Rent','Education','ATM / Cash','Other'
];

// ── SINGLE SOURCE OF TRUTH for category colour — ported verbatim from
// newDashboard.html so badges/icons here match the dashboard exactly. 11 genuinely
// distinct hues (coral, violet, teal, olive, magenta, sage, steel-blue, indigo,
// amber, slate, mauve); `text` is mid-luminance for legibility on both themes,
// `bg` is the same hue at low opacity for the pill.
const CAT_COLORS = {
  'Food & Dining':  { bg: 'rgba(217,119,87,0.16)',  text: '#D97757' },  // coral
  'Shopping':       { bg: 'rgba(155,111,212,0.16)', text: '#9B6FD4' },  // violet
  'Transport':      { bg: 'rgba(61,158,148,0.16)',  text: '#3D9E94' },  // teal
  'Utilities':      { bg: 'rgba(169,174,51,0.18)',  text: '#A9AE33' },  // Duranta olive
  'Entertainment':  { bg: 'rgba(199,107,158,0.16)', text: '#C76B9E' },  // magenta-pink
  'Healthcare':     { bg: 'rgba(95,168,112,0.16)',  text: '#5FA870' },  // sage green
  'Transfer / P2P': { bg: 'rgba(94,127,191,0.16)',  text: '#5E7FBF' },  // steel blue
  'Rent':           { bg: 'rgba(108,95,199,0.16)',  text: '#6C5FC7' },  // indigo
  'Education':      { bg: 'rgba(198,138,58,0.16)',  text: '#C68A3A' },  // amber
  'ATM / Cash':     { bg: 'rgba(126,140,174,0.18)', text: '#7E8CAE' },  // slate
  'Other':          { bg: 'rgba(154,143,176,0.16)', text: '#9A8FB0' },  // mauve-grey
};

// Category icons — Material Symbols (same set/weight as the dashboard), coloured
// per-category from CAT_COLORS so icon, badge and text always share one mapping.
const CAT_ICON_NAMES = {
  'Food & Dining':  'restaurant',
  'Shopping':       'shopping_bag',
  'Transport':      'directions_car',
  'Utilities':      'bolt',
  'Entertainment':  'movie',
  'Healthcare':     'medical_services',
  'Transfer / P2P': 'swap_horiz',
  'Rent':           'home',
  'Education':      'school',
  'ATM / Cash':     'local_atm',
  'Other':          'category',
};

function catIcon(cat) {
  const name = CAT_ICON_NAMES[cat] || CAT_ICON_NAMES['Other'];
  const c = CAT_COLORS[cat] || CAT_COLORS['Other'];
  return `<span class="material-symbols-outlined" style="font-size:18px;line-height:1;color:${c.text};flex-shrink:0;vertical-align:middle">${name}</span>`;
}

let _allTransactions = [];
let currentOffset = 0;
const pageSize = 20;
let _activeMonthFilter = null;   // set from URL param
let _activeCatFilter = null;     // set from URL param

function getCsrf() {
  return document.querySelector('meta[name="csrf-token"]').content;
}
const CSRF = getCsrf();

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtAmt(n) {
  return '₹' + parseFloat(n || 0).toLocaleString('en-IN', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}

function fmtDate(s) {
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function catPill(cat) {
  const c = CAT_COLORS[cat] || CAT_COLORS['Other'];
  return `<span style="display:flex;align-items:center;gap:6px;white-space:nowrap">${catIcon(cat)}<span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase" style="background:${c.bg};color:${c.text};white-space:nowrap">${escHtml(cat)}</span></span>`;
}

function emptyState(msg) {
  const text = msg || 'Upload a statement to see your data';
  return `<div class="flex flex-col items-center justify-center py-8 gap-2" style="color:var(--text-secondary)">
    <span class="material-symbols-outlined" style="font-size:28px;color:var(--text-secondary)">cloud_upload</span>
    <span class="text-sm">${escHtml(text)}</span>
  </div>`;
}

function showToast(msg, ok) {
  const t = document.createElement('div');
  t.style.cssText = [
    'position:fixed','bottom:24px','right:24px','z-index:9999',
    'padding:12px 20px','border-radius:8px','font-size:14px','font-weight:500',
    'box-shadow:0 4px 20px rgba(0,0,0,0.5)',
    'transition:opacity 0.4s,transform 0.4s',
    ok === false ? 'background:#ef4444;color:#fff' : 'background:var(--accent);color:var(--on-accent)'
  ].join(';');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; }, 2600);
  setTimeout(() => t.remove(), 3100);
}

// ---- URL param pre-filtering ----
function initFromURLParams() {
  const params = new URLSearchParams(window.location.search);
  const month = params.get('month');        // e.g. "2025-07"
  const category = params.get('category');   // e.g. "Food & Dining"

  if (month) {
    _activeMonthFilter = month;
    const label = formatMonthLabel(month);
    document.getElementById('active-filter-label').textContent = `Showing transactions for ${label}`;
    document.getElementById('active-filter-banner').style.display = 'flex';
    document.getElementById('page-subtitle').textContent = `Filtered: ${label}`;
  }

  if (category) {
    _activeCatFilter = category;
    const catEl = document.getElementById('cat-filter');
    if (catEl) catEl.value = category;
    const bannerLabel = document.getElementById('active-filter-label');
    const existing = bannerLabel.textContent;
    bannerLabel.textContent = existing
      ? existing + ` · Category: ${category}`
      : `Showing category: ${category}`;
    document.getElementById('active-filter-banner').style.display = 'flex';
    document.getElementById('page-subtitle').textContent = `Filtered: ${category}`;
  }
}

function formatMonthLabel(yyyymm) {
  // "2025-07" → "Jul 2025"
  const [y, m] = yyyymm.split('-');
  const d = new Date(parseInt(y), parseInt(m) - 1, 1);
  return d.toLocaleString('default', { month: 'short', year: 'numeric' });
}

function clearAllFilters() {
  _activeMonthFilter = null;
  _activeCatFilter = null;
  document.getElementById('cat-filter').value = '';
  document.getElementById('txn-search').value = '';
  document.getElementById('active-filter-banner').style.display = 'none';
  document.getElementById('page-subtitle').textContent = 'All your transactions';
  // Remove URL params without reloading
  window.history.replaceState({}, '', '/transactions');
  currentOffset = 0;
  filterTransactions();
}

function applyFilter(txns) {
  const catVal = (document.getElementById('cat-filter') || {}).value || _activeCatFilter || '';
  const searchVal = ((document.getElementById('txn-search') || {}).value || '').toLowerCase().trim();
  const sortVal = (document.getElementById('sort-select') || {}).value || 'date_desc';

  let filtered = txns;

  // Month filter (from URL param)
  if (_activeMonthFilter) {
    filtered = filtered.filter(t => t.date.startsWith(_activeMonthFilter));
  }
  // Category filter
  if (catVal) filtered = filtered.filter(t => t.category === catVal);
  // Search filter
  if (searchVal) filtered = filtered.filter(t =>
    (t.merchant || '').toLowerCase().includes(searchVal) ||
    (t.description || '').toLowerCase().includes(searchVal)
  );
  // Sort
  filtered = [...filtered].sort((a, b) => {
    if (sortVal === 'date_desc') return b.date.localeCompare(a.date);
    if (sortVal === 'date_asc')  return a.date.localeCompare(b.date);
    if (sortVal === 'amount_desc') return parseFloat(b.amount) - parseFloat(a.amount);
    if (sortVal === 'amount_asc')  return parseFloat(a.amount) - parseFloat(b.amount);
    return 0;
  });
  return filtered;
}

function renderTransactions(txns) {
  const tbody = document.getElementById('txn-tbody');
  const loadMoreBtn = document.getElementById('load-more-btn');
  const countEl = document.getElementById('txn-count-label');

  if (!txns || !txns.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8">${emptyState()}</td></tr>`;
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    if (countEl) countEl.textContent = '0 transactions';
    return;
  }

  const filtered = applyFilter(txns);
  if (countEl) countEl.textContent = `${filtered.length} transaction${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8"><div style="text-align: center; padding: 40px 20px; color: var(--text-secondary);">
    <div style="font-size: 28px; margin-bottom: 12px;">🗂️</div>
    <div style="font-size: 15px; font-weight: 500; margin-bottom: 6px;">No transactions found</div>
    <div style="font-size: 13px; opacity: 0.7;">No transactions match the current filters</div>
</div></td></tr>`;
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }

  const allShown = currentOffset + pageSize >= filtered.length;
  let rowsHtml = filtered.slice(0, currentOffset + pageSize).map(t => `
    <tr class="transaction-row transition-colors" data-txn-id="${escHtml(t.txn_id)}">
      <td class="px-6 py-4 text-sm" style="color:var(--text-secondary)">${fmtDate(t.date)}</td>
      <td class="px-6 py-4 text-sm text-white">${escHtml(t.merchant)}${t.is_subscription ? '<svg class="sub-icon" role="img" aria-label="Recurring subscription"><title>Recurring subscription</title><use href="#ico-subscription"></use></svg>' : ''}</td>
      <td class="px-6 py-4"><span class="cat-cell">${catPill(t.category)}</span></td>
      <td class="px-6 py-4 text-sm font-data-mono text-white text-right">${fmtAmt(t.amount)}</td>
      <td class="px-6 py-4 text-right">
        <button class="p-2 edit-btn cursor-pointer transition-colors"
          style="color:var(--text-secondary)"
          data-txn-id="${escHtml(t.txn_id)}"
          data-category="${escHtml(t.category)}"
          onmouseenter="this.style.color='var(--accent)'"
          onmouseleave="this.style.color='var(--text-secondary)'">
          <span class="material-symbols-outlined" style="font-size:16px">edit</span>
        </button>
      </td>
    </tr>
  `).join('');
  if (allShown) {
    rowsHtml += `<tr><td colspan="5" style="padding:0"><div style="text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; opacity: 0.6; border-top: 1px solid rgba(255,255,255,0.05);">
    ✦ All transactions shown
</div></td></tr>`;
  }
  tbody.innerHTML = rowsHtml;
  tbody.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openEdit(btn)));
  if (loadMoreBtn) {
    if (allShown) {
      loadMoreBtn.style.display = 'none';
    } else {
      loadMoreBtn.style.display = '';
      loadMoreBtn.textContent = `Load More (${filtered.length - currentOffset - pageSize} remaining)`;
    }
  }
}

function filterTransactions() {
  currentOffset = 0;
  renderTransactions(_allTransactions);
}

function loadMoreTransactions() {
  currentOffset += pageSize;
  renderTransactions(_allTransactions);
}

// ---- Inline Category Edit → POST /api/transactions/correct ----
function openEdit(btn) {
  const txnId = btn.dataset.txnId;
  const row = btn.closest('tr');
  const catCell = row.querySelector('.cat-cell');
  const origHtml = catCell.innerHTML;
  const origCat = btn.dataset.category;

  catCell.innerHTML = `
    <div class="flex items-center gap-1 flex-wrap">
      <select class="inline-edit-select">
        ${CATEGORIES.map(c =>
          `<option value="${escHtml(c)}" ${c === origCat ? 'selected' : ''}>${escHtml(c)}</option>`
        ).join('')}
      </select>
      <button class="save-edit px-2 py-1 rounded text-xs font-bold" style="background:var(--accent);color:var(--on-accent)">✓</button>
      <button class="cancel-edit px-2 py-1 rounded text-xs" style="background:var(--border);color:var(--text-secondary)">✕</button>
    </div>
  `;

  catCell.querySelector('.cancel-edit').addEventListener('click', () => {
    catCell.innerHTML = origHtml;
  });

  catCell.querySelector('.save-edit').addEventListener('click', async () => {
    const newCat = catCell.querySelector('.inline-edit-select').value;
    try {
      const res = await fetch('/api/transactions/correct', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCsrf()
        },
        body: JSON.stringify({ transaction_id: txnId, new_category: newCat })
      });
      const data = await res.json();
      if (data.status === 'success') {
        btn.dataset.category = newCat;
        catCell.innerHTML = catPill(newCat);
        // Update in-memory store so re-renders reflect the change
        const txn = _allTransactions.find(t => t.txn_id === txnId);
        if (txn) txn.category = newCat;
        showToast('✓ Category updated');
      } else {
        showToast('Update failed', false);
        catCell.innerHTML = origHtml;
      }
    } catch (_e) {
      showToast('Network error', false);
      catCell.innerHTML = origHtml;
    }
  });
}

// ---- Main data fetch ----
async function loadTransactions() {
  try {
    const res = await fetch('/api/transactions/classified', {
      headers: { 'X-CSRFToken': CSRF }
    });
    const data = await res.json();
    if (data.status !== 'success') throw new Error(data.message);
    _allTransactions = data.transactions;
    renderTransactions(_allTransactions);
  } catch(e) {
    showToast('Could not load transactions', true);
    document.getElementById('txn-tbody').innerHTML =
      `<tr><td colspan="5" class="px-6 py-8 text-center text-sm" style="color:var(--text-secondary)">Failed to load transactions.</td></tr>`;
    const countEl = document.getElementById('txn-count-label');
    if (countEl) countEl.textContent = '';
  }
}

// ---- Theme toggle ----
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light-mode');
  localStorage.setItem('arthalens-theme', isLight ? 'light' : 'dark');
  _syncThemeUI(isLight);
}
function _syncThemeUI(isLight) {
  const icon = document.getElementById('theme-icon');
  if (icon) icon.textContent = isLight ? '☀' : '☾';
  // Swap the navbar logo to match the theme (same logic as the dashboard).
  const logo = document.getElementById('navbar-logo');
  if (logo) logo.src = isLight ? logo.dataset.logoLight : logo.dataset.logoDark;
}
function initTheme() {
  _syncThemeUI(document.documentElement.classList.contains('light-mode'));
}

// ---- Mobile navigation (hamburger dropdown) ----
// Identical helper in newDashboard.html / transactions.html / upload.html.
// Deliberately does NOT stopPropagation: letting the click reach document keeps
// the existing profile-dropdown close-on-outside-click working, and the listener
// below ignores clicks originating inside the button or the panel.
function toggleMobileNav() {
  const panel = document.getElementById('nav-mobile-panel');
  if (!panel) return;
  _setMobileNav(panel.classList.contains('open') ? false : true);
}
function _setMobileNav(open) {
  const panel = document.getElementById('nav-mobile-panel');
  const btn   = document.getElementById('nav-mobile-btn');
  const icon  = document.getElementById('nav-mobile-icon');
  if (!panel) return;
  panel.classList.toggle('open', open);
  if (btn)  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (icon) icon.textContent = open ? 'close' : 'menu';
}
document.addEventListener('click', (e) => {
  const panel = document.getElementById('nav-mobile-panel');
  const btn   = document.getElementById('nav-mobile-btn');
  if (!panel || !panel.classList.contains('open')) return;
  if (panel.contains(e.target) || (btn && btn.contains(e.target))) return;
  _setMobileNav(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') _setMobileNav(false);
});
// Resizing past the md breakpoint hides the panel via CSS; reset the button
// state too so the icon and aria-expanded don't go stale.
window.addEventListener('resize', () => {
  if (window.innerWidth >= 768) _setMobileNav(false);
});

// ---- Profile dropdown ----
function toggleProfileDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById('profile-dropdown');
  if (!dd) return;
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', () => {
  const dd = document.getElementById('profile-dropdown');
  if (dd) dd.style.display = 'none';
});

// ---- Init ----
initTheme();
initFromURLParams();
loadTransactions();
</script>
</body>
</html>
